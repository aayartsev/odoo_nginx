<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gateway Ready</title>
  <style>
    :root {
      --bg0: #0c1210;
      --bg1: #15201c;
      --ink: #e8f0eb;
      --muted: #8aa399;
      --accent: #c4a35a;
      --accent-soft: rgba(196, 163, 90, 0.18);
      --line: rgba(232, 240, 235, 0.12);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 2rem;
      color: var(--ink);
      font-family: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
      background:
        radial-gradient(1200px 600px at 15% 10%, rgba(196, 163, 90, 0.14), transparent 55%),
        radial-gradient(900px 500px at 85% 90%, rgba(70, 120, 100, 0.2), transparent 50%),
        linear-gradient(160deg, var(--bg0), var(--bg1));
    }

    main {
      width: min(36rem, 100%);
      text-align: center;
      animation: rise 0.7s ease-out both;
    }

    .mark {
      width: 4.5rem;
      height: 4.5rem;
      margin: 0 auto 1.75rem;
      border-radius: 50%;
      border: 1px solid var(--line);
      background: var(--accent-soft);
      display: grid;
      place-items: center;
      animation: pulse 2.8s ease-in-out infinite;
    }

    .mark::after {
      content: "";
      width: 0.85rem;
      height: 0.85rem;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 0 0 rgba(196, 163, 90, 0.45);
      animation: ping 2.8s ease-out infinite;
    }

    h1 {
      font-size: clamp(2.4rem, 6vw, 3.4rem);
      font-weight: 600;
      letter-spacing: -0.03em;
      line-height: 1.05;
      margin-bottom: 0.85rem;
    }

    p {
      font-family: "Avenir Next", "Segoe UI", sans-serif;
      font-size: 1.05rem;
      line-height: 1.55;
      color: var(--muted);
      max-width: 28rem;
      margin: 0 auto;
    }

    .meta {
      margin-top: 2.25rem;
      padding-top: 1.25rem;
      border-top: 1px solid var(--line);
      font-family: "Avenir Next", "Segoe UI", sans-serif;
      font-size: 0.8rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--accent);
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.03); }
    }

    @keyframes ping {
      0% { box-shadow: 0 0 0 0 rgba(196, 163, 90, 0.45); }
      70% { box-shadow: 0 0 0 14px rgba(196, 163, 90, 0); }
      100% { box-shadow: 0 0 0 0 rgba(196, 163, 90, 0); }
    }

    @media (prefers-reduced-motion: reduce) {
      main, .mark, .mark::after { animation: none; }
    }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true"></div>
    <h1>Gateway Ready</h1>
    <p>This reverse proxy is online. No application is configured for this host yet.</p>
    <div class="meta">odoo · nginx</div>
  </main>
</body>
</html>
