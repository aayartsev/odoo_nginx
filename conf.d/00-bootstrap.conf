# Конфиг по умолчанию: nginx стартует без доменов и без сертификатов.
# ACME-challenge для выпуска сертификатов; остальное — заглушка.
# Доменные конфиги генерируются: ./scripts/generate-sites.sh

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        default_type text/plain;
        return 200 "odoo-nginx: bootstrap OK. Add sites to sites.list and run ./scripts/generate-sites.sh\n";
    }
}
