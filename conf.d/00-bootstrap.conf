# Конфиг по умолчанию: nginx стартует без доменов и без сертификатов.
# Статическая страница: /usr/share/nginx/html (том ./html)
# Доменные конфиги генерируются скриптом generate-sites.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
